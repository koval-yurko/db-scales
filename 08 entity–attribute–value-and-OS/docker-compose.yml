version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: eav-os-pg
    ports:
      - "5480:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-eav_os_demo}
    volumes:
      - ./data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "maintenance_work_mem=128MB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Single-node OpenSearch — the read model. Security plugin disabled so the demo
  # talks plain HTTP on 9280 (never do this in production).
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: eav-os-search
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9280:9200"   # REST API
      - "9680:9600"   # performance analyzer
    volumes:
      - ./os-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Optional: OpenSearch Dashboards (Kibana-equivalent) to explore the index by hand.
  dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    container_name: eav-os-dashboards
    ports:
      - "5681:5601"
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      - opensearch
    profiles: ["dashboards"]   # only starts with: docker-compose --profile dashboards up -d
