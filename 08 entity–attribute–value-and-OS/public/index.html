<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EAV + OpenSearch Catalog</title>
  <style>
    * { box-sizing: border-box; }
    body { font: 14px/1.5 system-ui, sans-serif; margin: 0; color: #1a1a1a; background: #f6f7f9; }
    header { background: #0b3b2e; color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 18px; }
    header small { color: #9fd4bf; }
    #sync-status { font-size: 12px; color: #cdeee0; }
    main { display: grid; grid-template-columns: 320px 1fr; gap: 16px; padding: 16px; align-items: start; }
    .panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 14px; margin-bottom: 16px; }
    .panel h2 { margin: 0 0 10px; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: #374151; }
    label { display: block; font-size: 12px; color: #6b7280; margin: 8px 0 2px; }
    input, select, button { font: inherit; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; width: 100%; }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }
    button { background: #0d9488; color: #fff; border: none; cursor: pointer; width: auto; padding: 8px 14px; }
    button.secondary { background: #6b7280; }
    button:hover { opacity: .92; }
    .actions { margin-top: 12px; display: flex; gap: 8px; align-items: center; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; }
    th { background: #f9fafb; position: sticky; top: 0; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #ecfdf5; }
    .meta { color: #6b7280; font-size: 12px; margin: 6px 0; }
    pre { background: #0f172a; color: #e2e8f0; padding: 10px; border-radius: 6px; overflow: auto; font-size: 12px; max-height: 320px; }
    .attrs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; }
    .hidden { display: none; }
    fieldset { border: 1px solid #e5e7eb; border-radius: 6px; padding: 8px; margin: 8px 0; }
    legend { font-size: 12px; color: #6b7280; }
    .check { display: flex; align-items: center; gap: 6px; }
    .check input { width: auto; }
    /* facet sidebar */
    .facets { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 10px; }
    .facet { border: 1px solid #e5e7eb; border-radius: 6px; padding: 8px; }
    .facet h3 { margin: 0 0 4px; font-size: 12px; text-transform: uppercase; color: #6b7280; }
    .facet .bucket { display: flex; justify-content: space-between; cursor: pointer; padding: 1px 2px; border-radius: 4px; }
    .facet .bucket:hover { background: #ecfdf5; }
    .facet .bucket .c { color: #6b7280; }
  </style>
</head>
<body>
  <header>
    <h1>EAV + OpenSearch <small>— PostgreSQL writes · OpenSearch reads</small></h1>
    <div id="sync-status">…</div>
  </header>
  <main>
    <div>
      <!-- FILTER / SEARCH / SORT -->
      <div class="panel">
        <h2>Filter · search · sort</h2>
        <label>Category</label>
        <select id="filter-category"></select>
        <label>Search (full-text)</label>
        <input id="filter-q" placeholder="e.g. ryzen, cotton…" />
        <div id="filter-fields"></div>
        <label>Price &lt;</label>
        <input id="filter-price" type="number" step="0.01" placeholder="any" />
        <div class="row">
          <div><label>Sort by</label><select id="sort-by"></select></div>
          <div><label>Dir</label><select id="sort-dir"><option value="asc">asc</option><option value="desc">desc</option></select></div>
        </div>
        <div class="actions">
          <button id="apply-filter">Apply</button>
          <label class="check" style="margin:0"><input type="checkbox" id="show-query" /> show query</label>
        </div>
      </div>

      <!-- SEED -->
      <div class="panel">
        <h2>Seed products</h2>
        <label>Category</label>
        <select id="seed-category"></select>
        <label>Count</label>
        <input id="seed-count" type="number" value="200" />
        <fieldset><legend>attributes to include</legend><div id="seed-attrs" class="attrs"></div></fieldset>
        <div class="actions"><button id="run-seed" class="secondary">Generate</button></div>
        <div class="meta" id="seed-status"></div>
      </div>

      <!-- CREATE / UPDATE -->
      <div class="panel">
        <h2 id="form-title">Create product</h2>
        <input type="hidden" id="edit-id" />
        <label>Category</label>
        <select id="form-category"></select>
        <div class="row">
          <div><label>SKU</label><input id="form-sku" /></div>
          <div><label>Price</label><input id="form-price" type="number" step="0.01" /></div>
        </div>
        <label>Name</label>
        <input id="form-name" />
        <div id="form-fields"></div>
        <div class="actions">
          <button id="save-product">Save</button>
          <button id="reset-form" class="secondary">New</button>
        </div>
        <div class="meta" id="form-status"></div>
      </div>
    </div>

    <!-- RESULTS -->
    <div class="panel">
      <h2>Results</h2>
      <div class="meta" id="results-meta">Apply a filter to see products.</div>
      <div class="facets" id="facets"></div>
      <div style="max-height:55vh; overflow:auto"><table id="results"><thead></thead><tbody></tbody></table></div>
      <pre id="query-box" class="hidden"></pre>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
